name: android

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "assets/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "assets/**"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test engine
        run: ./gradlew --no-daemon :core:test

      # 设置了签名 Secrets 则用固定签名（可覆盖升级）；否则用 runner 的 debug 签名
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::未设置 ANDROID_KEYSTORE_BASE64，APK 使用 debug 签名，更新时需先卸载旧版"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/LimbusHelper-${GITHUB_RUN_NUMBER}.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: LimbusHelper-apk
          path: dist/*.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.apk
