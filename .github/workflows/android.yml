name: android

env:
  # 与 ci.yml 保持一致；MaaFwApp 要求 >= v5.13.0
  MAAFW_VERSION: "v5.14.3"

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "assets/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "assets/**"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # MaaFwApp 作为子模块时，版本号按本仓库的提交数计算，需要完整历史
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: Put OCR model into resource
        run: |
          mkdir -p assets/resource/model/ocr
          cp -r assets/MaaCommonAssets/OCR/ppocr_v4/zh_cn/. assets/resource/model/ocr/

      - name: Download MaaFramework for Android
        working-directory: android/MaaFwApp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/setup_maa_framework.py --tag ${{ env.MAAFW_VERSION }}

      - name: Configure build
        working-directory: android/MaaFwApp
        run: |
          {
            echo "pi.profile=${GITHUB_WORKSPACE}/android/pi-profile.yaml"
            echo "build.debugAbi=arm64-v8a"
            echo "build.releaseAbi=arm64-v8a"
            echo "sdk.dir=${ANDROID_HOME}"
          } > local.properties
          cat local.properties

      # 设置了签名 Secrets 则出 release 包（签名固定，可直接覆盖升级）；否则出 debug 包
      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未设置 ANDROID_KEYSTORE_BASE64，改为构建 debug 包"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android/MaaFwApp
        env:
          KEYSTORE_PATH: ${{ steps.sign.outputs.variant == 'release' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.sign.outputs.variant }}" = "release" ]; then
            ./gradlew --no-daemon :app:assembleRelease
          else
            ./gradlew --no-daemon :app:assembleDebug
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          find android/MaaFwApp/app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          cd dist
          for f in *.apk; do mv "$f" "MAALimbusCompany-android-${{ steps.sign.outputs.variant }}.apk"; done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: MAALimbusCompany-android-apk
          path: dist/*.apk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.apk
