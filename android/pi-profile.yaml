# MaaFwApp 打包配方：把本项目的资源打进安卓 APK
# 字段说明见 android/MaaFwApp/pi-profile.sample.yaml 与 android/MaaFwApp/INTEGRATION.md
# 相对路径相对本文件所在目录

# 含 interface.json 的那一层
assets: ../assets

include:
  - interface.json
  - resource/**

# resource/base 与 resource/bilibili 是旧模板遗留，interface.json 并未加载
exclude:
  - resource/base/**
  - resource/bilibili/**

app:
  # 包名 com.aliothmoon.maafw.limbus
  id: limbus
  label: MAALimbusCompany

# 后台模式在虚拟屏上运行，固定 16:9，与识别模板一致
display:
  foreground: true
  presets:
    - label: 720P
      width: 1280
      height: 720
      dpi: 240
    - label: 1080P
      width: 1920
      height: 1080
      dpi: 280
